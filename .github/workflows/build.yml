name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SkinForge.sln -c Release --nologo
      - run: dotnet test tests/SkinForge.Tests/SkinForge.Tests.csproj -c Release --no-build --nologo
